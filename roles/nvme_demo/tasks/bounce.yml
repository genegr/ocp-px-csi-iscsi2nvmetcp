---
# Delete the demo pods (the StatefulSets recreate them, on whichever nodes) so every volume is detached and attached
# again. After the migration that is the proof that the data written over iSCSI is intact over NVMe/TCP.
# The deletion is not waited for with `wait: true`: the StatefulSets recreate pods with the same names and labels at once,
# so "no pod matches" never comes true (a live run waited its full timeout and failed). The new pods are recognised by uid.
- name: Demo pods now
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ mig_demo_ns }}"
    label_selectors: [app.kubernetes.io/part-of=px-nvme-demo]
  register: demo_before

- name: Delete the demo pods
  kubernetes.core.k8s:
    api_version: v1
    kind: Pod
    namespace: "{{ mig_demo_ns }}"
    label_selectors: [app.kubernetes.io/part-of=px-nvme-demo]
    state: absent
    wait: false
  when: not ansible_check_mode

- name: Every demo pod is a new one, and Ready again
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ mig_demo_ns }}"
    label_selectors: [app.kubernetes.io/part-of=px-nvme-demo]
  register: demo_after
  until: >-
    demo_after.resources | length == demo_sets | map(attribute='replicas') | map('int') | sum
    and demo_after.resources | map(attribute='metadata.uid') | list | intersect(demo_before.resources | map(attribute='metadata.uid') | list) | length == 0
    and demo_after.resources | map('k8s_condition', 'Ready') | unique | list == ['True']
  retries: 90
  delay: 10
  when: not ansible_check_mode
