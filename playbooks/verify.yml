---
# Where the migration stands, read-only: StorageCluster stage, per node the label, StorageNodeInitiator, addresses and
# storage facts (probe Pods), and the demo's health. Safe to run at any time.
- name: Cluster model and migration model
  hosts: localhost
  gather_facts: false
  roles:
    - nvme_model

- name: Report
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig }}"
    group/everpure.flasharray.everpure.flasharray:
      fa_url: "{{ mig_fa_endpoint }}"
      api_token: "{{ mig_fa_token }}"
  tasks:
    # -e 'verify_nodes=["master1"]' reports only those nodes (e.g. one the MCO has just brought back during a roll);
    # -e verify_demo=false skips the demo, which is not meant to be healthy while a node is being rebooted.
    - name: Only the nodes asked for
      ansible.builtin.set_fact:
        mig_nodes: "{{ mig_nodes | mig_pick_nodes(verify_nodes) }}"
      when: verify_nodes is defined

    - name: Live StorageCluster, CRDs and node plugin pods
      ansible.builtin.include_role:
        name: nvme_preflight
        tasks_from: discover.yml

    - name: The array's NVMe/TCP interfaces and host objects
      ansible.builtin.include_role:
        name: nvme_array
        tasks_from: info.yml
      vars:
        array_subsets: [network, hosts]

    - name: Portals the nodes should reach
      ansible.builtin.set_fact:
        mig_portal_ips: "{{ fa_network | nvme_portals(mig_cidrs) | rejectattr('cidr', 'eq', '') | map(attribute='address') | list }}"

    - name: Migration state
      ansible.builtin.include_role:
        name: nvme_migrate
        tasks_from: report.yml
      when: not ansible_check_mode

    - name: Is the demo deployed?
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ mig_demo_ns }}"
      register: verify_demo_ns

    - name: Demo workloads
      ansible.builtin.include_role:
        name: nvme_demo
        tasks_from: verify.yml
      when: not ansible_check_mode and verify_demo_ns.resources | length > 0 and verify_demo | default(true) | bool
