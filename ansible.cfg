# One config for both ways of running (README "Two ways to run it"): paths are relative to this file, so it works from
# the container (project mounted at /work) and from a checkout on any Ansible machine.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
filter_plugins = plugins/filter
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
